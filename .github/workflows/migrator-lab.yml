name: Migrator Lab

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Build
        run: dotnet build Migrator.sln -c Release
      - name: Contract tests
        run: dotnet test Migrator.Tests/Migrator.Tests.csproj -c Release --no-build --filter "Layer=Contract|FullyQualifiedName~LabAppTests|FullyQualifiedName~LabRunStatusPolicyTests"
      - name: Install Playwright Chromium
        shell: pwsh
        run: ./Migrator.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run smoke corpus
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab run --suite smoke --corpus ./corpus/stable/vertical-slice
          --out ./artifacts/lab/ci-smoke --timeout-seconds 600 --configuration Release
      - name: Triage smoke failures
        if: failure()
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab triage --run ./artifacts/lab/ci-smoke --corpus ./corpus/stable/vertical-slice
          --repo . --out ./artifacts/lab/ci-smoke-triage
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-lab-smoke
          path: |
            artifacts/lab/ci-smoke
            artifacts/lab/ci-smoke-triage
          if-no-files-found: warn

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Build
        run: dotnet build Migrator.sln -c Release
      - name: Full Migrator tests
        run: dotnet test Migrator.Tests/Migrator.Tests.csproj -c Release --no-build
      - name: Install Playwright Chromium
        shell: pwsh
        run: ./Migrator.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run full stable corpus
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab run --suite nightly --corpus ./corpus/stable/vertical-slice
          --out ./artifacts/lab/ci-nightly --timeout-seconds 600 --configuration Release
      - name: Triage stable nightly failures
        if: failure()
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab triage --run ./artifacts/lab/ci-nightly --corpus ./corpus/stable/vertical-slice
          --repo . --out ./artifacts/lab/ci-nightly-triage
      - name: Upload nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-lab-nightly
          path: |
            artifacts/lab/ci-nightly
            artifacts/lab/ci-nightly-triage
          if-no-files-found: warn
      - name: Choose reproducible generated seed
        id: generated_seed
        shell: bash
        run: echo "seed=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Generate pairwise metamorphic corpus
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab generate --corpus ./corpus/stable/vertical-slice --base p01-basic-id-login
          --seed ${{ steps.generated_seed.outputs.seed }} --count 6
          --out ./artifacts/lab/ci-generated/corpus --force
      - name: Run generated corpus
        continue-on-error: true
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab run --corpus ./artifacts/lab/ci-generated/corpus
          --out ./artifacts/lab/ci-generated/run --timeout-seconds 600 --configuration Release
      - name: Check metamorphic invariants and save candidates
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab metamorphic --manifest ./artifacts/lab/ci-generated/corpus/generation-manifest.json
          --run ./artifacts/lab/ci-generated/run --out ./artifacts/lab/ci-generated/metamorphic
          --save-candidates ./artifacts/lab/ci-generated/seed-candidates
      - name: Triage generated failures
        if: failure()
        run: >-
          dotnet run --project Migrator.Cli -c Release --no-build --
          lab triage --run ./artifacts/lab/ci-generated/run --corpus ./artifacts/lab/ci-generated/corpus
          --repo . --out ./artifacts/lab/ci-generated/triage
      - name: Upload generated corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-lab-generated-${{ steps.generated_seed.outputs.seed }}
          path: artifacts/lab/ci-generated
          if-no-files-found: warn
