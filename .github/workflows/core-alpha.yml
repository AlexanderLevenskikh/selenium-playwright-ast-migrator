name: Core Alpha
on:
  push:
    branches: [split/core-alpha]
  workflow_dispatch:
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Migrator.Application.Smoke/Migrator.Application.Smoke.csproj
      - run: dotnet build Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-restore -c Release
      - run: dotnet run --project Migrator.Application.Smoke/Migrator.Application.Smoke.csproj --no-restore -c Release
